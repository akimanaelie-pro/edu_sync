<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync Nexus - Offline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .offline-icon {
            font-size: 4rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="offline-card">
                    <div class="offline-icon">
                        <i class="fas fa-wifi-slash"></i>
                    </div>
                    <h3 class="mb-3" style="color: #1f293b;">You're Offline</h3>
                    <p class="text-muted mb-4">
                        EduSync Nexus is currently offline. Please check your internet connection.
                    </p>
                    <div class="d-grid gap-3">
                        <button onclick="location.reload()" class="btn btn-primary">
                            <i class="fas fa-sync-alt me-2"></i>Try Again
                        </button>
                        <a href="/sms/" class="btn btn-outline-secondary">
                            <i class="fas fa-home me-2"></i>Go to Dashboard
                        </a>
                    </div>
                    <div class="mt-4">
                        <small class="text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Some features may be available offline
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check online status
        window.addEventListener('online', () => {
            window.location.href = '/sms/';
        });
        
        // Auto-retry every 30 seconds
        setInterval(() => {
            if (navigator.onLine) {
                window.location.reload();
            }
        }, 30000);
    </script>
</body>
</html>
